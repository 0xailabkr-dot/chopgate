<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>This page does not exist.</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020308;
      color: #edf0f8;
      font: 16px/1.5 "IBM Plex Sans", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    main { width: min(100%, 40rem); padding: 32px 24px; }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.3; margin: 0 0 12px; }
    p { margin: 0 0 16px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 16px;
      border: 1px solid rgba(160, 180, 255, .2);
      border-radius: 12px;
      background: rgba(6, 8, 16, .6);
      color: #edf0f8;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #7fb2ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>This page does not exist.</h1>
    <p lang="ko">이 페이지는 없습니다.</p>
    <p class="links">
      <a id="home-link" href="./">Home</a>
      <a id="proof-link" href="./verify/">Proof</a>
    </p>
    <noscript>
      <p class="links">
        <a href="./">Home</a>
        <a href="./verify/">Proof</a>
      </p>
    </noscript>
  </main>
  <script>
  (function () {
    var token = "/chopgate/";
    var path = location.pathname || "";
    var at = path.indexOf(token);
    var home = document.getElementById("home-link");
    var proof = document.getElementById("proof-link");
    if (!home || !proof) return;
    if (at < 0) {
      home.setAttribute("href", "./");
      proof.setAttribute("href", "./verify/");
      return;
    }
    var prefix = location.origin + path.slice(0, at) + token;
    home.setAttribute("href", prefix);
    proof.setAttribute("href", prefix + "verify/");
  })();
  </script>
</body>
</html>
